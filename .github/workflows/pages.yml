# Publishes comfyurn-site/ to GitHub Pages on every push to development.
# Only that folder goes live; tests/, .claude/ and the rest stay in the repo only.
name: Deploy site

on:
  push:
    branches: [development]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: comfyurn-site
      - id: deploy
        uses: actions/deploy-pages@v4
