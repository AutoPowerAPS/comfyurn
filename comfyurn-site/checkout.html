<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Content Security Policy: scripts only from this site, styles also from Google Fonts. Inline style attributes are
     allowed (the pages set crops and colours with them). Framing protection needs host headers: see README "Hosting headers" -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Checkout | Comfyurn</title>
<meta name="description" content="Check out your Comfyurn bag: contact, delivery or pickup, and a summary of your order.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FAFAF8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FAFAF8'/%3E%3Cpath d='M9 12h14v3a3 3 0 0 1-3 3h-8a3 3 0 0 1-3-3z M11 18v4M21 18v4' fill='none' stroke='%231F7A80' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/checkout.css">
<!-- night mode: blocking on purpose, so the theme is set before first paint -->
<script src="js/site/theme.js"></script>
</head>
<body data-page="checkout">
<a class="skip" href="#main">Skip to checkout</a>

<!-- checkout keeps its own quiet header: logo and a way back, no search or menus -->
<header class="co-top">
  <div class="co-top-in">
    <a class="brand" href="index.html" aria-label="Comfyurn home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 13h18v4a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3z M10 20v5M22 20v5M7 13a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      comfyurn
    </a>
    <div class="co-right">
      <a class="co-back" href="products.html" aria-label="Back to the shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg></a>
      <button class="theme-btn" id="themeBtn" type="button" aria-pressed="false" aria-label="Switch to night mode"></button>
    </div>
  </div>
</header>

<main id="main" tabindex="-1">
  <div id="co" class="co"><p class="co-loading">Loading your bag…</p></div>
</main>

<footer class="site-foot" id="foot">
  <p class="foot-note"><b>Comfyurn</b> is a fictional furniture and home decor brand. Products, prices, ratings and specs are examples, and checkout is a demo: nothing is sold or charged.</p>
</footer>

<script src="js/site/util.js" defer></script>
<script src="js/data/catalog.js" defer></script>
<script src="js/shop/line-art.js" defer></script>
<script src="js/shop/ui.js" defer></script>
<script src="js/shop/store.js" defer></script>
<script src="js/shop/slip.js" defer></script>
<script src="js/shop/checkout.js" defer></script>
<script src="js/site/footer.js" defer></script>
</body>
</html>
